<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metacursion — Salesforce &amp; Google Cloud consulting</title>
  <meta name="description" content="Metacursion remotely develops advanced Lightning components and domain driven Apex, and offers Salesforce and Google Cloud consulting. Based in Auckland, New Zealand.">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="https://metacursion.com/">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Metacursion">
  <meta property="og:title" content="Metacursion — Salesforce &amp; Google Cloud consulting">
  <meta property="og:description" content="Advanced Lightning components, domain driven Apex, Salesforce and Google Cloud consulting. Auckland, New Zealand.">
  <meta property="og:url" content="https://metacursion.com/">
  <meta property="og:image" content="https://metacursion.com/logo.png">
  <meta property="og:image:width" content="720">
  <meta property="og:image:height" content="498">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #1b2533;
      --muted: #5b6878;
      --accent: #1a73c9;
      --border: #e3e8ef;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f141b;
        --card: #161d26;
        --text: #e6ebf1;
        --muted: #9aa7b6;
        --accent: #6cb8f2;
        --border: #263140;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 400 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 34rem;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 0 auto;
      padding: clamp(1.25rem, 5vw, 4rem) clamp(1rem, 4vw, 1.5rem);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: clamp(1.25rem, 5vw, 2.5rem);
    }
    header { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
    header img { width: 168px; height: auto; border-radius: 12px; display: block; }
    h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; letter-spacing: -.01em; }
    .location { margin: .25rem 0 0; color: var(--muted); font-size: .95rem; }
    h2 {
      margin: 2rem 0 .5rem;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    p { margin: 0 0 .5rem; }
    ul { margin: 0; padding-left: 1.2rem; }
    li { margin: .2rem 0; }
    li::marker { color: var(--muted); }
    a { color: var(--accent); text-decoration: none; text-underline-offset: 2px; }
    a:hover, a:focus-visible { text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
    .contact {
      display: inline-block;
      margin-top: .25rem;
      padding: .6rem 1.1rem;
      border-radius: 999px;
      background: var(--accent);
      color: var(--card);
      font-weight: 600;
    }
    .contact:hover, .contact:focus-visible { text-decoration: none; filter: brightness(1.08); }
    @media print {
      body { background: none; }
      .card { box-shadow: none; border: 0; }
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <header>
        <img src="logo.png" width="720" height="498" alt="Metacursion logo">
        <div>
          <h1>Metacursion</h1>
          <p class="location">Current location: Auckland, New Zealand</p>
        </div>
      </header>

      <h2>Remotely developing</h2>
      <ul>
        <li>Advanced Lightning components</li>
        <li>Domain driven Apex</li>
      </ul>

      <h2>Services</h2>
      <ul>
        <li>Salesforce consulting</li>
        <li>Google Cloud consulting</li>
      </ul>

      <h2>Contact</h2>
      <a class="contact" href="mailto:info@metacursion.com">info@metacursion.com</a>
    </div>
  </main>
</body>
</html>
